name: QA Framework CI

# Runs on every push to main, and on every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run web + API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run web adapter tests
        run: node src/adapters/playwright-adapter.js

      - name: Run API adapter tests
        run: node src/adapters/http-api-adapter.js

      - name: Upload evidence (screenshots) as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence/
          retention-days: 14