name: QA Framework CI

# Runs on every push to main, and on every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run web + API tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run web adapter tests
        run: node src/adapters/playwright-adapter.js

      - name: Run API adapter tests
        run: node src/adapters/http-api-adapter.js

      # Mobile tests are intentionally excluded here — they require a
      # physical device or emulator, which a standard CI runner doesn't
      # have. Mobile testing on real infrastructure is Phase 7's job.

      - name: Upload evidence (screenshots) as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: evidence/
          retention-days: 14